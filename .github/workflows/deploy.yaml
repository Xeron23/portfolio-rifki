name: Auto Deploy Backend to VPS

on:
  push:
    branches:
      - DEV  # ganti sesuai branch deploy kamu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 1800s
          command_timeout: 1800s
          script: |
            cd /opt/projects/portfolio-rifki

            # Ambil kode terbaru
            git pull origin DEV
            git status

            # Build di host
            npm ci
            npm run build

            # Restart container
            docker stop portfolio_rifki-server || true
            docker rm portfolio_rifki-server || true
            docker run -d \
              --name portfolio_rifki-server \
              --restart unless-stopped \
              -p 4003:4003 \
              portfolio_rifki
