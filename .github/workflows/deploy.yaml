name: Auto Deploy Backend to VPS

on:
  push:
    branches:
      - DEV  # ganti sesuai branch deploy kamu

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 28101
          timeout: 60s
          script: |
            cd /opt/portfolio-rifki

            # Ambil kode terbaru
            git pull origin DEV
            git status
            git remote -v
            git branch -vv

            # Build ulang image Docker
            docker build --no-cache -t portfolio_rifki .

            # Stop & remove container lama kalau ada
            docker stop portfolio_rifki-server || true
            docker rm portfolio_rifki-server || true
            # Run container baru dengan env & expose port
            docker run -d \
              --name portfolio_rifki-server \
              --restart unless-stopped \
              -p 4003:4003 \
              portfolio_rifki